<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UMochi Squad · PartnerFlow</title>
<meta name="description" content="PartnerFlow — Enterprise partner pre-approval &amp; claim reimbursement automation.">
<link rel="stylesheet" href="/css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2372CDFF'/%3E%3Cstop offset='1' stop-color='%23BFFFCC'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='43' font-family='system-ui' font-size='30' font-weight='800' text-anchor='middle' fill='%230F172A'%3EU%3C/text%3E%3C/svg%3E">
</head>
<body>
<div class="aurora" aria-hidden="true"><span class="a1"></span><span class="a2"></span><span class="a3"></span></div>

<a class="skip-link" href="#main">Skip to main content</a>

<header class="topbar" role="banner">
  <div class="topbar-left">
    <button class="icon-btn" id="sidebarToggle" type="button" aria-label="Toggle sidebar" aria-expanded="true" aria-controls="sidebar">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">U</div>
      <div class="brand-text">
        <strong id="brandName">UMochi Squad</strong>
        <span id="brandProduct">PartnerFlow</span>
      </div>
    </div>
  </div>

  <div class="topbar-center">
    <div class="engine-pill" id="enginePill" title="Rule engine version">
      <span class="dot"></span><span id="engineVersion">…</span>
    </div>
  </div>

  <div class="topbar-right">
    <button class="ghost-btn" id="askBrainBtn" type="button" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 3a4 4 0 0 0-4 4 3.5 3.5 0 0 0-1.5 6.6A3.5 3.5 0 0 0 9 20a3 3 0 0 0 3-1.6A3 3 0 0 0 15 20a3.5 3.5 0 0 0 2.5-6.4A3.5 3.5 0 0 0 16 7a4 4 0 0 0-4-4Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      Ask the Brain
    </button>
    <div id="sessionSlot"></div>
  </div>
</header>

<div class="shell">
  <nav class="sidebar" id="sidebar" role="navigation" aria-label="Main navigation">
    <ul class="nav-list" id="navList"></ul>
    <div class="sidebar-foot">
      <div class="foot-row"><span>RAG index</span><strong id="ragChunks">—</strong></div>
      <div class="foot-row"><span>LLM provider</span><strong id="llmProvider">—</strong></div>
      <div class="foot-row"><span>Uptime</span><strong id="uptime">—</strong></div>
    </div>
  </nav>

  <main class="main" id="main" tabindex="-1">
    <div id="view" class="view" aria-live="polite"></div>
  </main>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>
<div class="modal-root" id="modalRoot"></div>
<div class="drawer-root" id="drawerRoot"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
